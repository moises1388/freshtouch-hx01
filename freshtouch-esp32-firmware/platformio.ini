; FreshTouch ESP32 firmware v3
;
; board = esp32dev es un default genérico (ESP32-WROOM-32 en un dev
; board estándar) — AJUSTAR según lo que confirme la inspección física
; de HX02 (ver docs/FIRST-FLASH-HX02.md). Si el módulo real resulta ser
; otro (ESP32-S3, ESP32-C3, etc.), cambiar `board` aquí es normalmente
; suficiente — el código de src/ y lib/core/ no depende de un modelo
; específico de ESP32.
;
; No requiere NINGUNA librería externa (`lib_deps` vacío a propósito):
; WiFi.h, WebServer.h, DNSServer.h, Preferences.h y esp_system.h ya
; vienen con el framework arduino-esp32 — se evitó cualquier dependencia
; de terceros para minimizar riesgo de compilación y de cadena de
; suministro.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_dirs = lib
build_flags = -std=c++17
build_unflags = -std=gnu++11
